<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" role="img" aria-label="任务调度：依赖就绪的任务并行派给 builder，各自在独立 worktree 里改，门禁跑 CHECK 通过后串行合并；不通过修一轮再验收，还不通过交给你；测试统一经过闸门">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:13px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.b{font-weight:600}
.card{fill:#fff;stroke:#d0d7de}
.fg{fill:#1f2328}.mu{fill:#59636e}.note{fill:#7d8590;font-size:12.5px}
.ln{stroke:#8c959f;stroke-width:1.5;fill:none}.ar{fill:#8c959f}
.done{fill:#dafbe1;stroke:#4ac26b}.tdone{fill:#1a7f37}
.ready{fill:#ddf4ff;stroke:#54aeff}.tready{fill:#0969da}
.wait{fill:#f6f8fa;stroke:#d0d7de;stroke-dasharray:4 3}.twait{fill:#59636e}
.fix{fill:#ffebe9;stroke:#ff8182}.tfix{fill:#cf222e}
.gate{fill:#fff1e5;stroke:#fb8f44}.tg{fill:#bc4c00}
.strip{fill:#f6f8fa;stroke:#d0d7de}
@media (prefers-color-scheme:dark){
.card{fill:#151b23;stroke:#3d444d}
.fg{fill:#f0f6fc}.mu{fill:#9198a1}
.ln{stroke:#656c76}.ar{fill:#656c76}
.done{fill:#0f2d1a;stroke:#238636}.tdone{fill:#3fb950}
.ready{fill:#0c2d6b;stroke:#1f6feb}.tready{fill:#4493f8}
.wait{fill:#212830;stroke:#3d444d}.twait{fill:#9198a1}
.fix{fill:#3c1618;stroke:#da3633}.tfix{fill:#f85149}
.gate{fill:#2e1a0a;stroke:#bd561d}.tg{fill:#f0883e}
.strip{fill:#151b23;stroke:#3d444d}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ar" d="M0 0L10 5L0 10z"/></marker></defs>

<!-- 任务手册：依赖图 -->
<rect class="card" x="20" y="14" width="210" height="262" rx="12"/>
<text class="fg b" x="36" y="40" style="font-size:15px">任务手册</text>
<text class="mu" x="36" y="59" style="font-size:12.5px">一张依赖图，不是清单</text>
<line class="ln" x1="115" y1="112" x2="86" y2="144" marker-end="url(#a)"/>
<line class="ln" x1="135" y1="112" x2="164" y2="144" marker-end="url(#a)"/>
<line class="ln" x1="86" y1="174" x2="115" y2="206" marker-end="url(#a)"/>
<line class="ln" x1="164" y1="174" x2="135" y2="206" marker-end="url(#a)"/>
<rect class="done" x="95" y="84" width="60" height="28" rx="14"/><text class="tdone b mono" x="125" y="103" text-anchor="middle">T1 ✓</text>
<rect class="ready" x="50" y="146" width="60" height="28" rx="14"/><text class="tready b mono" x="80" y="165" text-anchor="middle">T2</text>
<rect class="ready" x="140" y="146" width="60" height="28" rx="14"/><text class="tready b mono" x="170" y="165" text-anchor="middle">T3</text>
<rect class="wait" x="95" y="208" width="60" height="28" rx="14"/><text class="twait b mono" x="125" y="227" text-anchor="middle">T4</text>
<rect class="done" x="36" y="252" width="12" height="12" rx="6"/><text class="mu" x="53" y="262" style="font-size:12px">完成</text>
<rect class="ready" x="94" y="252" width="12" height="12" rx="6"/><text class="mu" x="111" y="262" style="font-size:12px">就绪</text>
<rect class="wait" x="152" y="252" width="12" height="12" rx="6"/><text class="mu" x="169" y="262" style="font-size:12px">等待</text>

<!-- 并行派发 -->
<text class="note" x="262" y="40">依赖满足的任务同时派发</text>
<line class="ln" x1="232" y1="86" x2="260" y2="86" marker-end="url(#a)"/>
<line class="ln" x1="232" y1="170" x2="260" y2="170" marker-end="url(#a)"/>

<rect class="card" x="262" y="56" width="170" height="60" rx="10"/>
<text class="fg b" x="276" y="80"><tspan class="mono">builder</tspan><tspan class="mu" style="font-weight:400"> · T2</tspan></text>
<text class="mu" x="276" y="102" style="font-size:12.5px">独立 git worktree 里改</text>
<line class="ln" x1="432" y1="86" x2="462" y2="86" marker-end="url(#a)"/>
<rect class="card" x="464" y="56" width="150" height="60" rx="10"/>
<text class="fg b mono" x="478" y="80">verifier</text>
<text class="mu" x="478" y="102" style="font-size:12.5px">跑手册里的 CHECK</text>

<rect class="card" x="262" y="140" width="170" height="60" rx="10"/>
<text class="fg b" x="276" y="164"><tspan class="mono">builder</tspan><tspan class="mu" style="font-weight:400"> · T3</tspan></text>
<text class="mu" x="276" y="186" style="font-size:12.5px">独立 git worktree 里改</text>
<line class="ln" x1="432" y1="170" x2="462" y2="170" marker-end="url(#a)"/>
<rect class="card" x="464" y="140" width="150" height="60" rx="10"/>
<text class="fg b mono" x="478" y="164">verifier</text>
<text class="mu" x="478" y="186" style="font-size:12.5px">跑手册里的 CHECK</text>

<!-- 通过：串行合并 -->
<line class="ln" x1="614" y1="86" x2="678" y2="86" marker-end="url(#a)"/>
<line class="ln" x1="614" y1="170" x2="678" y2="170" marker-end="url(#a)"/>
<rect class="done" x="626" y="76" width="40" height="20" rx="10"/><text class="tdone b" x="646" y="90" text-anchor="middle" style="font-size:11.5px">通过</text>
<rect class="done" x="626" y="160" width="40" height="20" rx="10"/><text class="tdone b" x="646" y="174" text-anchor="middle" style="font-size:11.5px">通过</text>
<rect class="card" x="680" y="56" width="180" height="144" rx="12"/>
<text class="fg b" x="696" y="82" style="font-size:15px">串行合并</text>
<text class="fg" x="696" y="108">一次合一个任务</text>
<text class="fg" x="696" y="128">回到集成分支</text>
<text class="mu" x="696" y="158" style="font-size:12.5px">合并前检查改动</text>
<text class="mu" x="696" y="178" style="font-size:12.5px">没有越出可写范围</text>

<!-- 不通过：修一轮 -->
<line class="ln" x1="578" y1="200" x2="578" y2="242" marker-end="url(#a)"/>
<line class="ln" x1="500" y1="244" x2="500" y2="202" marker-end="url(#a)"/>
<rect class="fix" x="586" y="211" width="52" height="20" rx="10"/><text class="tfix b" x="612" y="225" text-anchor="middle" style="font-size:11.5px">不通过</text>
<rect class="card" x="440" y="211" width="52" height="20" rx="10"/><text class="fg b" x="466" y="225" text-anchor="middle" style="font-size:11.5px">再验收</text>
<rect class="fix" x="464" y="244" width="150" height="32" rx="10"/>
<text class="tfix b" x="539" y="265" text-anchor="middle">带着发现修一轮</text>
<line class="ln" x1="614" y1="260" x2="678" y2="260" marker-end="url(#a)"/>
<rect class="gate" x="680" y="244" width="180" height="32" rx="16"/>
<text class="tg b" x="770" y="265" text-anchor="middle">还不通过，交给你</text>

<!-- 测试闸门 -->
<rect class="strip" x="20" y="298" width="840" height="58" rx="10"/>
<text x="36" y="322"><tspan class="fg b">测试闸门</tspan><tspan class="fg">　全机所有会话共用 2 个测试槽位，满了排队；每次运行限 4 GB 内存，超了只杀这一次，不拖垮整机</tspan></text>
<text x="36" y="344"><tspan class="fg b">测试选择</tspan><tspan class="fg">　子任务只跑和改动相关的测试，完整测试只在最后一道门禁跑一次</tspan></text>
</svg>
